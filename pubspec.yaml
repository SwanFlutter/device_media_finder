name: device_media_finder
description: "A fast Flutter plugin to list device videos and audio of any size/format with full metadata, SQL-paginated loading and cached background thumbnails."
version: 0.2.0
homepage: "https://github.com/SwanFlutter/device_media_finder"

environment:
  sdk: ^3.13.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:

  plugin:
    platforms:
      android:
        package: com.example.device_media_finder
        pluginClass: DeviceMediaFinderPlugin
      ios:
        pluginClass: DeviceMediaFinderPlugin
      macos:
        pluginClass: DeviceMediaFinderPlugin


